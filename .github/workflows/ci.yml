name: CI Quality Gates

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  validate-frontend:
    name: Frontend (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest

    env:
      USE_MOCKS: 'true'
      PAYPAL_ENV: 'sandbox'
      PAYPAL_CLIENT_ID: 'mock_client_id_ci'
      PAYPAL_CLIENT_SECRET: 'mock_client_secret_ci'
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: 'mock_client_id_ci'
      CHANNEL3_API_KEY: 'mock_channel3_key'
      GEMINI_API_KEY: 'mock_gemini_key'
      GROQ_API_KEY: 'mock_groq_key'
      LLM_MODEL: 'gemini-2.5-flash'
      DATABASE_URL: 'postgres://user:password@localhost:5432/guardpay'
      APP_BASE_URL: 'http://localhost:3000'
      DEMO_MODE: 'replay'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend
        run: pnpm lint

      - name: Run TypeScript Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: pnpm test

      - name: Verify Next.js Production Build
        working-directory: frontend
        run: pnpm build
